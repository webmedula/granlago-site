[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# URLs do site antigo (WordPress) que precisam continuar funcionando
[[redirects]]
  from = "/simulador"
  to = "https://gransimulador.netlify.app/simulador"
  status = 301
  force = true

[[redirects]]
  from = "/simulador/"
  to = "https://gransimulador.netlify.app/simulador"
  status = 301
  force = true

[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
